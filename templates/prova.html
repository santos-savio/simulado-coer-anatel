<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Simulado COER</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='prova.css') }}">
    <script>
        (function () {
            var stored = localStorage.getItem('coer-theme');
            var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (stored === 'dark' || (!stored && prefersDark)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
</head>
<body>

    <div class="quiz-container">
        <div id="app">
            <div class="progress-container">
                <progress class="progress is-primary" value="1" max="10" id="progressBar">1%</progress>
            </div>

            <div id="question" class="question">
                A pergunta será exibida aqui
            </div>

            <div id="options">
                <!-- Opções aparecerão aqui via JS -->
            </div>

            <button id="nextBtn" class="button is-link is-fullwidth">Próxima</button>
        </div>

        <script>window.PROVA_NOME = "{{ prova_nome }}";</script>
        <script src="/static/script.js"></script>
    </div>

    <!-- Modal de confirmação para sair da prova -->
    <div id="exitModal" class="modal">
        <div class="modal-background"></div>
        <div class="modal-card">
            <header class="modal-card-head">
                <p class="modal-card-title">Confirmar saída</p>
            </header>
            <section class="modal-card-body">
                <p>Tem certeza que deseja sair da prova?</p>
                <p class="has-text-weight-semibold mt-2">Seu progresso será perdido.</p>
            </section>
            <footer class="modal-card-foot">
                <button class="button is-danger" id="confirmExit">Sim, sair da prova</button>
                <button class="button" id="cancelExit">Cancelar</button>
            </footer>
        </div>
    </div>

    <script>
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
            if (!localStorage.getItem('coer-theme')) {
                document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
            }
        });
    </script>
</body>
</html>
